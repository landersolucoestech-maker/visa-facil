name: Deploy Visa Fácil Website

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate website/CRM
        run: node scripts/validate-public-site.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_CRM_MOCKS: 'true'
        run: npm run build

      - name: Verify company logic is absent from contact CRM build
        run: |
          if grep -RniE "Pessoa Jurídica|personType|legalName|tradeName|contactPerson|isCompany" apps/web/dist; then
            echo "Forbidden company contact logic found in production bundle"
            exit 1
          fi

      - name: Create SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
