name: Patch campaign actions

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-campaign-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Refactor campaign actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('apps/web/src/modules/marketing/MarketingApp.tsx')
          s = app.read_text()

          old_render = "{section==='campaigns'&&<Campaigns campaigns={campaigns} totals={totals} edit={r=>setCampaignModal({mode:'edit',record:r})}/>} "
          new_render = "{section==='campaigns'&&<Campaigns campaigns={campaigns} totals={totals} edit={r=>setCampaignModal({mode:'edit',record:r})} remove={r=>setCampaigns(c=>c.filter(x=>x.id!==r.id))}/>} "
          if old_render not in s:
              raise SystemExit('campaign render signature not found')
          s = s.replace(old_render, new_render, 1)

          new_campaigns = r'''function Campaigns({campaigns,totals,edit,remove}:{campaigns:Campaign[];totals:{budget:number;spent:number;leads:number;conversions:number};edit:(r:Campaign)=>void;remove:(r:Campaign)=>void}){
 const [q,setQ]=useState('');
 const [status,setStatus]=useState('Todos');
 const [platform,setPlatform]=useState('Todas');
 const [menu,setMenu]=useState<string>();
 const [view,setView]=useState<Campaign>();
 const filtered=campaigns.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())&&(status==='Todos'||c.status===status)&&(platform==='Todas'||c.paidPlatforms.includes(platform as PaidPlatform)));
 const doDelete=(c:Campaign)=>{setMenu(undefined);if(window.confirm(`Excluir a campanha “${c.name}”?`))remove(c)};
 return <>
  <section className="marketing-kpis"><Kpi label="Campanhas" value={campaigns.length} note="total"/><Kpi label="Orçamento" value={money(totals.budget)} note="planejado"/><Kpi label="Gasto" value={money(totals.spent)} note="tráfego pago"/><Kpi label="Conversões" value={totals.conversions} note="resultados"/></section>
  <section className="marketing-table-card" onClick={()=>setMenu(undefined)}>
   <div className="marketing-campaign-toolbar"><input placeholder="Buscar campanha..." value={q} onChange={e=>setQ(e.target.value)}/><select value={status} onChange={e=>setStatus(e.target.value)}><option>Todos</option><option>Ativa</option><option>Agendada</option><option>Pausada</option><option>Rascunho</option></select><select value={platform} onChange={e=>setPlatform(e.target.value)}><option>Todas</option>{PAID_PLATFORMS.map(p=><option key={p}>{p}</option>)}</select></div>
   <div className="marketing-table-head marketing-table-head--campaign"><span>Campanha</span><span>Plataformas</span><span>Status</span><span>Orçamento</span><span>Gasto</span><span>CTR/Leads</span><span className="marketing-actions-head">Ações</span></div>
   {filtered.map(c=><div className="marketing-table-row marketing-table-row--campaign" key={c.id}><div><strong>{c.name}</strong><small>{c.objective}</small></div><span>{c.paidPlatforms.join(', ')}</span><span><b className="marketing-status">{c.status}</b></span><span>{money(c.budget)}</span><span>{money(c.spent)}</span><span>{c.leads} leads</span><div className="marketing-row-actions" onClick={e=>e.stopPropagation()}><button className="marketing-action-trigger" aria-label={`Ações da campanha ${c.name}`} aria-expanded={menu===c.id} onClick={()=>setMenu(menu===c.id?undefined:c.id)}>⋮</button>{menu===c.id&&<div className="marketing-action-menu"><button onClick={()=>{setMenu(undefined);setView(c)}}>Ver</button><button onClick={()=>{setMenu(undefined);edit(c)}}>Editar</button><button className="is-danger" onClick={()=>doDelete(c)}>Excluir</button></div>}</div></div>)}
  </section>
  {view&&<div className="marketing-modal-backdrop" onClick={()=>setView(undefined)}><div className="marketing-campaign-view" onClick={e=>e.stopPropagation()}><header><div><span>CAMPANHA</span><h2>{view.name}</h2><p>{view.objective}</p></div><button onClick={()=>setView(undefined)}>×</button></header><div className="marketing-campaign-view-grid"><div><span>Status</span><strong>{view.status}</strong></div><div><span>Plataformas</span><strong>{view.paidPlatforms.join(', ')}</strong></div><div><span>Orçamento</span><strong>{money(view.budget)}</strong></div><div><span>Gasto</span><strong>{money(view.spent)}</strong></div><div><span>Leads</span><strong>{view.leads}</strong></div><div><span>Conversões</span><strong>{view.conversions}</strong></div><div><span>Período</span><strong>{dateLabel(view.startDate)} — {dateLabel(view.endDate)}</strong></div><div><span>Faixa etária</span><strong>{view.ageRange}</strong></div><div className="is-wide"><span>Público</span><strong>{view.audience}</strong></div><div className="is-wide"><span>Headline</span><strong>{view.headline}</strong></div><div className="is-wide"><span>Copy principal</span><strong>{view.primaryCopy}</strong></div><div className="is-wide"><span>URL de destino</span><strong>{view.destinationUrl}</strong></div></div><footer><button className="crm-btn-secondary" onClick={()=>setView(undefined)}>Fechar</button><button className="crm-btn-primary" onClick={()=>{const current=view;setView(undefined);edit(current)}}>Editar</button></footer></div></div>}
 </>
}'''
          pattern = r"function Campaigns\([\s\S]*?\n\nfunction Calendar\("
          replaced, count = re.subn(pattern, new_campaigns + "\n\nfunction Calendar(", s, count=1)
          if count != 1:
              raise SystemExit(f'campaign function replacement count={count}')
          app.write_text(replaced)

          css = Path('apps/web/src/modules/marketing/marketing-overrides.css')
          c = css.read_text()
          marker = '/* campaign-actions-menu */'
          if marker not in c:
              c += r'''

/* campaign-actions-menu */
.marketing-actions-head{text-align:center}.marketing-row-actions{position:relative;display:flex;align-items:center;justify-content:center}.marketing-action-trigger{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border:1px solid var(--crm-border);border-radius:9px;background:#fff;color:var(--crm-navy);font-size:20px;line-height:1;cursor:pointer}.marketing-action-trigger:hover,.marketing-action-trigger[aria-expanded=true]{background:#f2f6fb;border-color:#b8c5d8}.marketing-action-menu{position:absolute;right:0;top:40px;z-index:60;width:150px;padding:6px;border:1px solid var(--crm-border);border-radius:11px;background:#fff;box-shadow:0 16px 38px rgba(5,17,39,.18)}.marketing-action-menu button{display:flex;width:100%;min-height:36px;align-items:center;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--crm-navy);font-size:12px;font-weight:800;text-align:left;cursor:pointer}.marketing-action-menu button:hover{background:#f3f6fa}.marketing-action-menu button.is-danger{color:var(--crm-red)}.marketing-campaign-view{width:min(760px,94vw);max-height:90vh;overflow:auto;border-radius:18px;background:#fff;box-shadow:0 28px 80px rgba(5,17,39,.3)}.marketing-campaign-view>header{position:relative;padding:18px 20px;border-bottom:1px solid var(--crm-border)}.marketing-campaign-view>header span{color:var(--crm-red);font-size:10px;font-weight:900;letter-spacing:.12em}.marketing-campaign-view>header h2{margin:4px 0 2px;color:var(--crm-navy);font-size:21px}.marketing-campaign-view>header p{margin:0;color:var(--crm-muted);font-size:12px}.marketing-campaign-view>header>button{position:absolute;right:16px;top:16px;width:34px;height:34px;border:1px solid var(--crm-border);border-radius:9px;background:#fff;color:var(--crm-navy);font-size:20px;cursor:pointer}.marketing-campaign-view-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:10px 20px 18px}.marketing-campaign-view-grid>div{padding:12px 0;border-bottom:1px solid #edf1f6}.marketing-campaign-view-grid>div:nth-child(odd):not(.is-wide){padding-right:18px}.marketing-campaign-view-grid>div:nth-child(even){padding-left:18px;border-left:1px solid #edf1f6}.marketing-campaign-view-grid .is-wide{grid-column:1/-1}.marketing-campaign-view-grid span,.marketing-campaign-view-grid strong{display:block}.marketing-campaign-view-grid span{color:var(--crm-muted);font-size:10px;font-weight:800;text-transform:uppercase}.marketing-campaign-view-grid strong{margin-top:5px;color:var(--crm-navy);font-size:12px}.marketing-campaign-view>footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--crm-border)}
'''
              css.write_text(c)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-campaign-actions.yml
          git add apps/web/src/modules/marketing/MarketingApp.tsx apps/web/src/modules/marketing/marketing-overrides.css
          git commit -m "fix(marketing): add campaign actions menu"
          git push origin dev

# retrigger
