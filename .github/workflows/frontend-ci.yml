name: Website CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate architecture contract
        run: npm run validate

      - name: Structural lint
        run: npm run lint

      - name: Contract tests
        run: npm test

      - name: Dependency audit
        run: npm run audit

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            /tmp/typecheck.log
            /tmp/build.log
            /tmp/visa-facil-vite.log
            /tmp/browser-*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Production runtime smoke
        shell: bash
        run: |
          npm --workspace @visa-facil/web run preview -- --port 4173 > /tmp/visa-facil-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/root.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/tmp/root.html
          curl -fsS http://127.0.0.1:4173/crm >/tmp/crm.html
          grep -q '<div id="root"></div>' /tmp/root.html
          grep -q '<div id="root"></div>' /tmp/crm.html

      - name: Rendered CRM browser smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "Chrome/Chromium não encontrado no runner; o gate de renderização não pode ser executado." >&2
            exit 1
          fi

          npm --workspace @visa-facil/web run preview -- --port 4173 > /tmp/visa-facil-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/crm >/dev/null; then
              break
            fi
            sleep 1
          done

          render_route() {
            route="$1"
            expected="$2"
            slug="$(printf '%s' "$route" | tr '/:' '__' | sed 's/^_*//')"
            [ -n "$slug" ] || slug="root"
            output="/tmp/browser-${slug}.html"
            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=5000 \
              --dump-dom "http://127.0.0.1:4173${route}" > "$output"
            grep -Fq "$expected" "$output" || {
              echo "A rota ${route} não renderizou o conteúdo esperado: ${expected}" >&2
              exit 1
            }
            grep -Fq 'crm-workspace' "$output" || {
              echo "A rota ${route} não montou o workspace do CRM." >&2
              exit 1
            }
          }

          render_route '/crm' 'Dashboard'
          render_route '/crm/relacionamento' 'Central de relacionamento operacional.'
          render_route '/crm/agenda' 'Agenda'
          render_route '/crm/tarefas' 'Tarefas'
          render_route '/crm/atendimentos' 'VisaChat'
          render_route '/crm/contratos' 'Contratos'
          render_route '/crm/financeiro' 'Receitas, despesas, contas a pagar e contas a receber.'
          render_route '/crm/financeiro/invoices' 'Faturamento e Notas Fiscais'
          render_route '/crm/marketing' 'Visão Geral'
          render_route '/crm/marketing/briefings' 'Briefings'
          render_route '/crm/marketing/tarefas' 'Tarefas de Marketing'
          render_route '/crm/relatorios' 'Relatórios'
          render_route '/crm/configuracoes' 'Configurações'

          CHROME_BIN="$chrome_bin" CRM_SMOKE_BASE_URL="http://127.0.0.1:4173" node scripts/browser-crm-interactions.mjs
