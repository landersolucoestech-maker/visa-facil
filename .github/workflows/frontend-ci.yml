name: Frontend CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate migration contract
        run: node scripts/validate-public-site.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile once
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push origin HEAD:dev

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production runtime smoke
        shell: bash
        run: |
          npm --workspace @visa-facil/web run preview -- --port 4173 > /tmp/visa-facil-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/root.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/tmp/root.html
          curl -fsS http://127.0.0.1:4173/app/ >/tmp/app.html
          grep -q '<div id="root"></div>' /tmp/root.html
          grep -q '<div id="root"></div>' /tmp/app.html
