name: Website CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate architecture contract
        run: npm run validate

      - name: Structural lint
        run: npm run lint

      - name: Contract tests
        run: npm test

      - name: Dependency audit
        run: npm run audit

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            /tmp/typecheck.log
            /tmp/build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Production runtime smoke
        shell: bash
        run: |
          npm --workspace @visa-facil/web run preview -- --port 4173 > /tmp/visa-facil-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/root.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/tmp/root.html
          curl -fsS http://127.0.0.1:4173/crm >/tmp/crm.html
          grep -q '<div id="root"></div>' /tmp/root.html
          grep -q '<div id="root"></div>' /tmp/crm.html
